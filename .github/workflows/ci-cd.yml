name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prd]
        default: dev
      model:
        description: Model deployment to evaluate (must be deployed in the target env)
        type: choice
        options: [gpt-4.1, gpt-4.1-mini, gpt-5]
        default: gpt-4.1

concurrency:
  group: cicd-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
  EVAL_DEPLOYMENT: ${{ github.event.inputs.model }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        shell: pwsh
        run: ./scripts/run-unit-tests.ps1

  functional-tests:
    name: Playwright functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Playwright tests
        shell: pwsh
        run: ./scripts/run-playwright.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  infra:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        shell: pwsh
        run: >
          ./scripts/deploy-infra.ps1
          -Env $env:TARGET_ENV
          -EvaluatorPrincipalId $env:EVALUATOR_PRINCIPAL_ID
        env:
          EVALUATOR_PRINCIPAL_ID: ${{ secrets.AZURE_EVALUATOR_PRINCIPAL_ID }}

  evals:
    name: Agentic evaluation gate
    runs-on: ubuntu-latest
    needs: [infra]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify selected model is deployed to target env
        if: env.EVAL_DEPLOYMENT != ''
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          $outputs = Get-InfraOutputs $env:TARGET_ENV
          $available = @($outputs['openAiDeployments'])
          if ($available -notcontains $env:EVAL_DEPLOYMENT) {
            Write-Host "::error::Model '$($env:EVAL_DEPLOYMENT)' is not deployed to '$($env:TARGET_ENV)'. Available: $($available -join ', '). Add it to infra/main.$($env:TARGET_ENV).bicepparam and redeploy before evaluating it."
            exit 1
          }
          Write-Host "Model '$($env:EVAL_DEPLOYMENT)' is deployed to '$($env:TARGET_ENV)'."
      - name: Run agentic evaluations (blocks deployment on regression)
        shell: pwsh
        run: >
          ./scripts/run-evals.ps1
          -Env $env:TARGET_ENV
          -Threshold 0.9
          -MaxSevere 0
          -Deployment $env:EVAL_DEPLOYMENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results
          retention-days: 30

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: [evals]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Functions backend
        shell: pwsh
        run: ./scripts/deploy-backend.ps1 -Env $env:TARGET_ENV

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Static Web App frontend
        shell: pwsh
        run: ./scripts/deploy-frontend.ps1 -Env $env:TARGET_ENV
